name: Quality gates

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-high-confidence:
    name: quality / static-high-confidence
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned quality image
        run: |
          docker build --file docker/open_lmm.Dockerfile \
            --tag open-lmm-quality:ci .
      - name: Run required clang-tidy profile
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/root/workspace" \
            --workdir /root/workspace \
            open-lmm-quality:ci \
            scripts/ci/run_static_analysis.sh required \
              /usr/bin/clang-15 /usr/bin/clang++-15
      - name: Preserve static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-static-high-confidence-evidence
          path: .ci-build/quality-static-required
          if-no-files-found: error
          retention-days: 14

  fuzz-smoke:
    name: quality / fuzz-smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned quality image
        run: |
          docker build --file docker/open_lmm.Dockerfile \
            --tag open-lmm-quality:ci .
      - name: Build and run ASan/UBSan fuzz smoke
        run: |
          image_digest=$(docker image inspect --format '{{.Id}}' open-lmm-quality:ci)
          docker run --rm \
            --env OPEN_LMM_CI_IMAGE_DIGEST="$image_digest" \
            --volume "$GITHUB_WORKSPACE:/root/workspace" \
            --workdir /root/workspace \
            open-lmm-quality:ci \
            scripts/ci/build_fuzz_tests.sh quality-fuzz-smoke \
              /usr/bin/clang-15 /usr/bin/clang++-15 smoke
      - name: Preserve fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-fuzz-smoke-evidence
          path: .ci-build/quality-fuzz-smoke
          if-no-files-found: error
          retention-days: 14

  critical-coverage:
    name: quality / critical-coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned quality image
        run: |
          docker build --file docker/open_lmm.Dockerfile \
            --tag open-lmm-quality:ci .
      - name: Verify reviewed critical branch baseline
        run: |
          image_digest=$(docker image inspect --format '{{.Id}}' open-lmm-quality:ci)
          docker run --rm \
            --env OPEN_LMM_CI_IMAGE_DIGEST="$image_digest" \
            --volume "$GITHUB_WORKSPACE:/root/workspace" \
            --workdir /root/workspace \
            open-lmm-quality:ci \
            scripts/ci/run_critical_coverage.sh quality-critical-coverage \
              /usr/bin/clang-15 /usr/bin/clang++-15 verify
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-critical-coverage-evidence
          path: .ci-build/quality-critical-coverage
          if-no-files-found: error
          retention-days: 14

  static-broad:
    name: quality / static-broad
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned quality image
        run: |
          docker build --file docker/open_lmm.Dockerfile \
            --tag open-lmm-quality:ci .
      - name: Run broad advisory profile
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/root/workspace" \
            --workdir /root/workspace \
            open-lmm-quality:ci \
            scripts/ci/run_static_analysis.sh advisory \
              /usr/bin/clang-15 /usr/bin/clang++-15
      - name: Preserve broad static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-static-broad-evidence
          path: .ci-build/quality-static-advisory
          if-no-files-found: warn
          retention-days: 30

  fuzz-nightly:
    name: quality / fuzz-nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned quality image
        run: |
          docker build --file docker/open_lmm.Dockerfile \
            --tag open-lmm-quality:ci .
      - name: Run nightly ASan/UBSan fuzzing
        run: |
          image_digest=$(docker image inspect --format '{{.Id}}' open-lmm-quality:ci)
          docker run --rm \
            --env OPEN_LMM_CI_IMAGE_DIGEST="$image_digest" \
            --volume "$GITHUB_WORKSPACE:/root/workspace" \
            --workdir /root/workspace \
            open-lmm-quality:ci \
            scripts/ci/build_fuzz_tests.sh quality-fuzz-nightly \
              /usr/bin/clang-15 /usr/bin/clang++-15 nightly
      - name: Preserve nightly fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-fuzz-nightly-evidence
          path: .ci-build/quality-fuzz-nightly
          if-no-files-found: warn
          retention-days: 30

  mutation-feasibility:
    name: quality / mutation-feasibility
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned quality image
        run: |
          docker build --file docker/open_lmm.Dockerfile \
            --tag open-lmm-quality:ci .
      - name: Run bounded RuntimeStateStore mutation pilot
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/root/workspace" \
            --workdir /root/workspace \
            open-lmm-quality:ci \
            scripts/ci/run_mutation_feasibility.sh quality-mutation-pilot \
              /usr/bin/clang-15 /usr/bin/clang++-15
      - name: Preserve mutation feasibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-mutation-feasibility-evidence
          path: .ci-build/quality-mutation-pilot
          if-no-files-found: warn
          retention-days: 30
