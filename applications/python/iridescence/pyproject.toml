[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "open-lmm-iridescence"
version = "3.0.0"
description = "Native Python Iridescence desktop GUI for OpenLMM"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "GPL-3.0-only"}
dependencies = [
  "open-lmm==3.0.0",
  "numpy>=1.21,<2",
  "pyridescence==1.0.3",
]

[project.scripts]
open-lmm-iridescence = "open_lmm_iridescence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["package/open_lmm_iridescence"]
