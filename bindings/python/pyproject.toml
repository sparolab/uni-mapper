[build-system]
requires = [
  "scikit-build-core>=0.10,<1",
  "pybind11>=2.9,<3",
  "numpy>=1.21,<2",
]
build-backend = "scikit_build_core.build"

[project]
name = "open-lmm"
version = "3.0.0"
description = "Python API v1 for the OpenLMM RuntimeClient"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "GPL-3.0-only" }
dependencies = ["numpy>=1.21,<2"]

[tool.scikit-build]
cmake.version = ">=3.25"
cmake.source-dir = "."
wheel.packages = ["package/open_lmm"]
install.components = ["Python"]
cmake.args = [
  "-DOPEN_LMM_PYTHON_STAGE_LOCAL_WHEEL_RUNTIME=ON",
  "-DBUILD_TESTING=OFF",
]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
